<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fellowship of the Rizz — A Text Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f5edd8;
    --parchment-dark: #e8d9b8;
    --parchment-deeper: #d4c49a;
    --ink: #1a1006;
    --ink-mid: #3a2810;
    --gold: #8b6800;
    --gold-bright: #c49a1a;
    --gold-light: #f0d070;
    --red: #7a1500;
    --green-dark: #1a3a1a;
    --shadow: rgba(20,10,0,0.4);
    --glow: rgba(196,154,26,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0800;
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── STARFIELD BACKGROUND ── */
  #starfield {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, #1a0d00 0%, #0d0800 50%, #000 100%);
    overflow: hidden;
  }
  .star {
    position: absolute; border-radius: 50%;
    background: #f0d070; animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%,100% { opacity: var(--min-op, 0.2); transform: scale(1); }
    50% { opacity: var(--max-op, 0.9); transform: scale(1.3); }
  }

  /* ── MAIN CONTAINER ── */
  #app {
    position: relative; z-index: 10;
    max-width: 780px; margin: 0 auto;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }

  /* ── SCREEN SYSTEM ── */
  .screen { display: none; animation: fadeIn 0.6s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ── BOOK PANEL ── */
  .book-panel {
    background: var(--parchment);
    border: 2px solid var(--gold);
    border-radius: 4px;
    box-shadow:
      0 0 0 4px var(--parchment-dark),
      0 0 0 6px var(--gold),
      0 8px 40px var(--shadow),
      inset 0 0 60px rgba(139,104,0,0.08);
    position: relative;
    overflow: hidden;
  }
  .book-panel::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid var(--parchment-deeper);
    pointer-events: none; z-index: 1;
  }
  .book-panel::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 10% 10%, rgba(255,240,180,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, rgba(139,104,0,0.08) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  .panel-inner { position: relative; z-index: 2; padding: 36px 40px; }

  /* ── TYPOGRAPHY ── */
  .title-main {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 5vw, 34px);
    color: var(--gold);
    text-align: center; line-height: 1.2;
    text-shadow: 0 2px 8px rgba(139,104,0,0.4);
    letter-spacing: 0.02em;
  }
  .title-sub {
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 2.5vw, 16px);
    color: var(--ink-mid); text-align: center;
    letter-spacing: 0.12em; margin-top: 6px;
  }
  .chapter-heading {
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 2.8vw, 17px);
    color: var(--gold); text-align: center;
    letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .chapter-sub {
    font-family: 'Lora', serif; font-style: italic;
    font-size: clamp(11px, 2.2vw, 13px);
    color: var(--ink-mid); text-align: center;
    margin-bottom: 16px;
  }
  .narrative {
    font-size: clamp(13px, 2.4vw, 15.5px);
    line-height: 1.85; color: var(--ink);
    margin-bottom: 14px; text-align: justify;
  }
  .narrative em { color: var(--red); font-style: italic; }
  .narrative strong { color: var(--ink); font-weight: 700; }
  .narrative .gold { color: var(--gold); font-weight: 600; }

  /* ── ORNAMENT ── */
  .ornament {
    text-align: center; color: var(--gold);
    font-size: 18px; margin: 16px 0;
    letter-spacing: 6px;
  }
  .rule {
    border: none; border-top: 1px solid var(--gold);
    margin: 16px auto; width: 85%; opacity: 0.6;
  }

  /* ── STAT BAR ── */
  #stat-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--parchment-dark);
    border: 1px solid var(--gold);
    border-radius: 3px; padding: 5px 10px;
    font-family: 'Cinzel', serif;
    font-size: 11px; color: var(--ink-mid);
    display: flex; align-items: center; gap: 5px;
    flex: 1; min-width: 90px;
  }
  .stat-label { opacity: 0.7; }
  .stat-value { color: var(--gold); font-weight: 600; margin-left: auto; }
  .stat-icon { font-size: 13px; }

  /* ── CHOICE BUTTONS ── */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .choice-btn {
    background: var(--parchment-dark);
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 13px 18px;
    font-family: 'Lora', serif;
    font-size: clamp(12px, 2.3vw, 14px);
    color: var(--ink); cursor: pointer;
    text-align: left; line-height: 1.5;
    transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .choice-btn::before {
    content: '❧';
    color: var(--gold); margin-right: 10px;
    font-size: 14px; opacity: 0.7;
  }
  .choice-btn:hover {
    background: var(--parchment);
    border-color: var(--gold-bright);
    box-shadow: 0 0 12px var(--glow), inset 0 0 20px rgba(196,154,26,0.06);
    transform: translateX(4px);
    color: var(--ink);
  }
  .choice-btn:active { transform: translateX(2px); }
  .choice-btn .choice-effect {
    display: block; font-size: 11px;
    font-family: 'Cinzel', serif;
    color: var(--gold); margin-top: 4px;
    opacity: 0.8; letter-spacing: 0.05em;
  }
  .choice-btn.danger { border-color: var(--red); }
  .choice-btn.danger::before { color: var(--red); content: '⚔'; }
  .choice-btn.danger:hover { box-shadow: 0 0 12px rgba(122,21,0,0.3); }

  /* ── SPEECH BUBBLES ── */
  .message-feed { margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    display: flex; gap: 10px; align-items: flex-start;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    background: var(--parchment-dark);
  }
  .msg-bubble {
    background: var(--parchment-dark);
    border: 1px solid var(--parchment-deeper);
    border-radius: 0 8px 8px 8px;
    padding: 9px 13px; max-width: 85%;
  }
  .msg-name {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 0.06em;
    margin-bottom: 3px; font-weight: 600;
  }
  .msg-text { font-size: 13.5px; line-height: 1.6; color: var(--ink); }
  .msg-time { font-size: 10px; color: var(--ink-mid); opacity: 0.5; margin-top: 3px; }
  .msg.player { flex-direction: row-reverse; }
  .msg.player .msg-bubble {
    background: rgba(139,104,0,0.12);
    border-color: rgba(139,104,0,0.3);
    border-radius: 8px 0 8px 8px;
  }
  .msg.player .msg-name { color: var(--ink-mid); }

  /* ── LORE KEEPER NARRATION ── */
  .lore-keeper {
    background: rgba(139,104,0,0.07);
    border-left: 3px solid var(--gold);
    padding: 12px 16px; margin: 14px 0;
    border-radius: 0 4px 4px 0;
    font-style: italic;
    font-size: clamp(12px, 2.2vw, 14px);
    line-height: 1.75; color: var(--ink-mid);
  }
  .lore-keeper .lk-label {
    font-family: 'Cinzel', serif; font-style: normal;
    font-size: 10px; color: var(--gold);
    letter-spacing: 0.1em; display: block;
    margin-bottom: 5px; opacity: 0.8;
  }

  /* ── DICE ROLL ── */
  .dice-container {
    text-align: center; margin: 20px 0;
    padding: 20px;
    background: rgba(139,104,0,0.05);
    border: 1px dashed var(--gold);
    border-radius: 4px;
  }
  .dice { font-size: 52px; display: inline-block; cursor: pointer;
    transition: transform 0.1s; user-select: none; }
  .dice:hover { transform: scale(1.1); }
  .dice.rolling { animation: roll 0.6s ease; }
  @keyframes roll {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(180deg) scale(1.3); }
    75% { transform: rotate(360deg) scale(0.9); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .dice-result {
    font-family: 'Cinzel', serif; font-size: 22px;
    color: var(--gold); margin-top: 10px;
  }
  .dice-label { font-size: 13px; color: var(--ink-mid); margin-bottom: 8px; }

  /* ── INVENTORY / JOURNAL ── */
  .inventory {
    background: var(--parchment-dark);
    border: 1px solid var(--parchment-deeper);
    border-radius: 3px; padding: 12px 16px;
    margin: 12px 0;
  }
  .inventory-title {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .inventory-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .item {
    background: var(--parchment);
    border: 1px solid var(--gold);
    border-radius: 3px; padding: 4px 10px;
    font-size: 12px; color: var(--ink);
  }
  .item .item-icon { margin-right: 4px; }

  /* ── PROGRESS MAP ── */
  .progress-map {
    display: flex; justify-content: center;
    gap: 0; margin: 16px 0; flex-wrap: wrap;
  }
  .progress-node {
    display: flex; flex-direction: column;
    align-items: center; position: relative;
  }
  .progress-node:not(:last-child)::after {
    content: '────';
    color: var(--parchment-deeper);
    font-size: 10px; margin: 0 -2px;
    line-height: 1; align-self: center;
    margin-top: -16px;
  }
  .progress-node.done::after { color: var(--gold); }
  .node-dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--parchment-deeper);
    background: var(--parchment);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .progress-node.done .node-dot { border-color: var(--gold); background: rgba(139,104,0,0.15); }
  .progress-node.current .node-dot { border-color: var(--gold-bright); background: rgba(196,154,26,0.2); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--glow); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .node-label { font-size: 9px; color: var(--ink-mid); margin-top: 3px; text-align: center; max-width: 50px; font-family: 'Cinzel', serif; }

  /* ── NOTIFICATION TOAST ── */
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: var(--gold-light);
    font-family: 'Cinzel', serif; font-size: 13px;
    padding: 12px 24px; border-radius: 3px;
    border: 1px solid var(--gold);
    box-shadow: 0 4px 20px var(--shadow);
    z-index: 1000; opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    letter-spacing: 0.05em; text-align: center;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; }

  /* ── TITLE SCREEN EXTRAS ── */
  .title-ornament {
    font-size: 26px; text-align: center;
    color: var(--gold); letter-spacing: 10px;
    margin: 10px 0;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { text-shadow: 0 0 10px rgba(196,154,26,0.2); }
    50% { text-shadow: 0 0 20px rgba(196,154,26,0.6), 0 0 40px rgba(196,154,26,0.2); }
  }
  .start-btn {
    display: block; width: 100%; max-width: 280px;
    margin: 24px auto 0;
    background: var(--gold);
    color: var(--parchment);
    border: 2px solid var(--gold-bright);
    border-radius: 3px; padding: 14px 28px;
    font-family: 'Cinzel', serif; font-size: 15px;
    letter-spacing: 0.12em; cursor: pointer;
    transition: all 0.2s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    box-shadow: 0 4px 16px rgba(139,104,0,0.4);
  }
  .start-btn:hover {
    background: var(--gold-bright);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(196,154,26,0.4);
  }

  /* ── CHARACTER SELECT ── */
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  @media (max-width: 480px) { .char-grid { grid-template-columns: 1fr; } }
  .char-card {
    background: var(--parchment-dark);
    border: 1.5px solid var(--parchment-deeper);
    border-radius: 4px; padding: 14px;
    cursor: pointer; transition: all 0.2s ease;
    position: relative;
  }
  .char-card:hover, .char-card.selected {
    border-color: var(--gold);
    background: var(--parchment);
    box-shadow: 0 0 16px var(--glow);
  }
  .char-card.selected::after {
    content: '✦'; position: absolute; top: 8px; right: 10px;
    color: var(--gold); font-size: 14px;
  }
  .char-emoji { font-size: 28px; margin-bottom: 6px; }
  .char-name { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); margin-bottom: 4px; }
  .char-desc { font-size: 12px; line-height: 1.5; color: var(--ink-mid); }
  .char-stat { margin-top: 8px; }
  .char-stat-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  .char-stat-label { color: var(--ink-mid); font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
  .char-stat-pip { display: flex; gap: 2px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--gold); }
  .pip.filled { background: var(--gold); }

  /* ── NAME INPUT ── */
  .name-input {
    width: 100%; padding: 10px 14px;
    background: var(--parchment);
    border: 1px solid var(--gold);
    border-radius: 3px;
    font-family: 'Lora', serif; font-size: 15px;
    color: var(--ink); margin: 12px 0;
    outline: none;
  }
  .name-input:focus { box-shadow: 0 0 10px var(--glow); }

  /* ── ENDING SCREEN ── */
  .ending-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(18px, 4vw, 26px);
    color: var(--gold); text-align: center;
    margin-bottom: 8px; line-height: 1.3;
  }
  .ending-verse {
    font-style: italic; text-align: center;
    color: var(--red); line-height: 2;
    font-size: clamp(12px, 2.4vw, 14.5px);
    margin: 16px 0;
  }
  .scroll-reveal { opacity: 0; animation: scrollReveal 0.8s ease forwards; }
  .scroll-reveal:nth-child(1) { animation-delay: 0.1s; }
  .scroll-reveal:nth-child(2) { animation-delay: 0.3s; }
  .scroll-reveal:nth-child(3) { animation-delay: 0.5s; }
  .scroll-reveal:nth-child(4) { animation-delay: 0.7s; }
  .scroll-reveal:nth-child(5) { animation-delay: 0.9s; }
  @keyframes scrollReveal { to { opacity: 1; } }

  /* ── ACHIEVEMENT BADGE ── */
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(139,104,0,0.12);
    border: 1px solid var(--gold);
    border-radius: 3px; padding: 8px 14px;
    margin: 6px 4px;
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 0.05em;
  }
  .badge-icon { font-size: 16px; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #1a0d00; }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

  /* ── UTILITY ── */
  .text-center { text-align: center; }
  .mt-12 { margin-top: 12px; }
  .mb-8 { margin-bottom: 8px; }
  .small-italic { font-style: italic; font-size: 12px; color: var(--ink-mid); }
  .highlight-box {
    border: 1px solid var(--gold); border-radius: 3px;
    padding: 14px 18px; margin: 14px 0;
    background: rgba(139,104,0,0.05);
  }
</style>
</head>
<body>

<div id="starfield"></div>
<div id="app">
  <!-- SCREENS INJECTED BY JS -->
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════
const G = {
  playerName: '',
  playerClass: null,
  // Stats
  aura: 50,
  wisdom: 50,
  rizz: 50,
  // Relationships
  rel: { lukas: 0, calli: 0, amber: 0, charlotte: 0, jordan: 0 },
  // Inventory
  items: [],
  // Progress
  chapter: 0,
  scene: 0,
  endings: [],
  // Flags
  flags: {},
  // Score
  loool: 0,
};

// ═══════════════════════════════════════════════════════════════
// CHARACTERS
// ═══════════════════════════════════════════════════════════════
const CHARS = {
  lukas:    { name: 'Lukas',    emoji: '📷', color: '#8b4a00', title: 'The Photographus' },
  calli:    { name: 'Calli',    emoji: '💄', color: '#6b3a6b', title: 'The Aged Wise One' },
  amber:    { name: 'Amber',    emoji: '🥂', color: '#8b6800', title: 'Of the Coast' },
  charlotte:{ name: 'Charlotte',emoji: '🦊', color: '#2a5a2a', title: 'Of the Distant Realm' },
  jordan:   { name: 'Jordan',   emoji: '👻', color: '#3a3a5a', title: 'The Vanishing One' },
};

const PLAYER_CLASSES = [
  {
    id: 'lurker',
    emoji: '🫥',
    name: 'The Lurker',
    desc: 'Reads everything. Says nothing. Has seen too much.',
    stats: { aura: 40, wisdom: 70, rizz: 30 },
    pips: { aura: 2, wisdom: 4, rizz: 1 },
    bonus: 'You notice details others miss. +2 to all insight checks.',
  },
  {
    id: 'chaotic',
    emoji: '🌪️',
    name: 'The Chaotic Good',
    desc: 'Sends messages at 2am. Somehow always right.',
    stats: { aura: 70, wisdom: 30, rizz: 60 },
    pips: { aura: 4, wisdom: 1, rizz: 3 },
    bonus: 'Your chaos is infectious. Lukas and Amber start +10.',
  },
  {
    id: 'analyst',
    emoji: '🧐',
    name: 'The Analyst',
    desc: 'Has opinions about everything. Especially Topshop.',
    stats: { aura: 30, wisdom: 70, rizz: 50 },
    pips: { aura: 1, wisdom: 4, rizz: 3 },
    bonus: 'Calli respects you immediately. Charlotte notices.',
  },
  {
    id: 'vibes',
    emoji: '✨',
    name: 'Pure Vibes',
    desc: 'No one is quite sure what you do. You have excellent energy.',
    stats: { aura: 80, wisdom: 40, rizz: 80 },
    pips: { aura: 4, wisdom: 2, rizz: 4 },
    bonus: 'Amber immediately wants to be your best friend.',
  },
];

// ═══════════════════════════════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════════════════════════════
function buildStarfield() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --dur:${2+Math.random()*5}s;
      --delay:${Math.random()*5}s;
      --min-op:${0.1+Math.random()*0.2};
      --max-op:${0.5+Math.random()*0.5};
    `;
    sf.appendChild(s);
  }
}

// ═══════════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); window.scrollTo(0,0); }
}

function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function pip(n, max=5) {
  return Array.from({length:max}, (_,i) =>
    `<span class="pip ${i<n?'filled':''}"></span>`).join('');
}

function statBar() {
  const pc = PLAYER_CLASSES.find(c => c.id === G.playerClass);
  if (!pc) return '';
  return `
    <div id="stat-bar">

    </div>`;
}

function relBar() {
  return Object.entries(G.rel).map(([k,v]) => {
    const c = CHARS[k]; const pct = Math.max(0, Math.min(100, 50+v));
    return `<div class="stat"><span class="stat-icon">${c.emoji}</span><span class="stat-label">${c.name.toUpperCase()}</span><span class="stat-value">${pct}%</span></div>`;
  }).join('');
}

function adjustStat(stat, amount) {
  G[stat] = Math.max(0, Math.min(100, G[stat] + amount));
}
function adjustRel(char, amount) {
  G.rel[char] = Math.max(-50, Math.min(50, G.rel[char] + amount));
}
function addItem(item) {
  if (!G.items.includes(item)) { G.items.push(item); toast(`✦ Item acquired: ${item}`); }
}

function msgHtml(char, text, time) {
  const c = CHARS[char];
  return `<div class="msg">
    <div class="msg-avatar">${c.emoji}</div>
    <div class="msg-bubble">
      <div class="msg-name">${c.name.toUpperCase()} · ${c.title}</div>
      <div class="msg-text">${text}</div>
      <div class="msg-time">${time || 'just now'}</div>
    </div>
  </div>`;
}

function playerMsg(text) {
  return `<div class="msg player">
    <div class="msg-avatar">🧑</div>
    <div class="msg-bubble">
      <div class="msg-name">${G.playerName.toUpperCase() || 'YOU'}</div>
      <div class="msg-text">${text}</div>

    </div>
  </div>`;
}

function lk(text) {
  return `<div class="lore-keeper"><span class="lk-label">✦ THE LORE KEEPER OBSERVES ✦</span>${text}</div>`;
}

function progressMap(current) {
  const nodes = [
    {label:'The Calling', icon:'📜'},
    {label:'The Sardine', icon:'🐟'},
    {label:'Bruce Lore', icon:'⚔️'},
    {label:'The Coaster', icon:'🥂'},
    {label:'Emma Quest', icon:'🎵'},
    {label:'Final Test', icon:'⭐'},
  ];
  return `<div class="progress-map">${nodes.map((n,i) =>
    `<div class="progress-node ${i<current?'done':i===current?'current':''}">
      <div class="node-dot">${n.icon}</div>
      <div class="node-label">${n.label}</div>
    </div>`).join('')}</div>`;
}

function diceRoll() {
  return Math.floor(Math.random() * 20) + 1;
}

      ${msgHtml('calli', 'two of you now. I worry.', '17:47')}`;
    addItem("🗑️ Alan Carr's Bin Arm (Defended)");
  } else if (c === 'topshop') {
    adjustRel('lukas',15); adjustRel('calli',8); adjustRel('amber',8);
    resp = `${playerMsg("I don't care about Alan Carr but that Topshop ad is genuinely terrible and I will not be moved on this")}
      ${msgHtml('lukas', 'The Nugent Review concurs', '17:47')}
      ${msgHtml('calli', 'saggy jacket. saggy leggings. those shoes.', '17:47')}
      ${msgHtml('amber', 'zero stars. absolutely not.', '17:47')}`;
    addItem('⭐ The Nugent Review: Zero Stars');
  } else if (c === 'de_escalate') {
    adjustRel('calli',12); adjustRel('amber',10); adjustStat('wisdom',10);
    resp = `${playerMsg("Nobody make any new groups. I need everyone to take a breath. The bin is fine.")}
      ${msgHtml('calli', 'thank you. a voice of reason.', '17:47')}
      ${msgHtml('lukas', 'fine. FINE. no new group.', '17:47')}
      ${msgHtml('amber', 'crisis averted. carry on.', '17:47')}`;
  } else {
    adjustRel('lukas',-25); adjustStat('rizz',-20);
    resp = `${playerMsg("Actually I think the bin thing is a bit much")}
      ${msgHtml('lukas', '...', '17:47')}
      ${msgHtml('lukas', 'making a new group', '17:47')}
      ${msgHtml('lukas', 'jk. but i am very disappointed.', '17:47')}
      ${msgHtml('amber', 'you had one job', '17:47')}`;
    toast("⚠️ You questioned Alan Carr's bin arm. Lukas is disappointed. This goes in the scrolls.", 4000);
  }

  // Calli's Wisdom — the final scene
  document.getElementById('screen-ch5').querySelector('.panel-inner').innerHTML = `
    ${progressMap(5)}
    ${statBar()}
    <hr class="rule">
    <h2 class="chapter-heading">CHAPTER THE FIFTH — THE PEARL OF WISDOM</h2>
    <div class="message-feed">${resp}</div>
    <hr class="rule">
    ${lk(`And then, in the middle of everything — in between the topshop reviews and the Alan Carr
    discourse and the general noise — Calli said something. She said it quietly.
    She accompanied it with the elderly woman emoji. And it landed.`)}
    <div class="message-feed">
      ${msgHtml('calli', 'People never stop behaving like children. I think you realise that as you get older. 👵🏼', '18:26')}
      ${msgHtml('amber', 'Our wise queen', '18:27')}
      ${msgHtml('lukas', 'i never will thats for sure', '18:26')}
      ${msgHtml('charlotte', 'true', '18:26')}
    </div>
    ${lk(`The pearl has been cast. The fellowship has received it.
    You must now respond to Calli's wisdom. This is your final act.
    Choose who you are in this fellowship.`)}
    <div class="choices">
      <button class="choice-btn" onclick="ch5Wisdom('agree')">
        "The evidence for this is everywhere and has been, today, overwhelming"
        <span class="choice-effect">+20 Calli · Wisdom acknowledged</span>
      </button>
      <button class="choice-btn" onclick="ch5Wisdom('optimist')">
        "I prefer to think of it as sustained enthusiasm for life"
        <span class="choice-effect">+15 Lukas/Amber · You are one of them now</span>
      </button>
      <button class="choice-btn" onclick="ch5Wisdom('jordan')">
        Say nothing. Delete what you were going to say. Become Jordan.
        <span class="choice-effect">+30 Jordan · Completion of the circle</span>
      </button>
    </div>`;
}

function ch5Wisdom(c) {
  let resp = '';
  if (c === 'agree') {
    adjustRel('calli',20); adjustStat('wisdom',15); G.loool+=2;
    resp = `${playerMsg('The evidence for this is everywhere and has been, today, overwhelming')}
      ${msgHtml('calli', 'the new member gets it', '18:27')}
      ${msgHtml('amber', 'they really do 🥺', '18:27')}
      ${msgHtml('lukas', 'welcome to the fellowship officially', '18:27')}`;
    G.flags.wisdomPath = 'sage';
  } else if (c === 'optimist') {
    adjustRel('lukas',15); adjustRel('amber',12); G.loool+=3;
    resp = `${playerMsg("I prefer to think of it as sustained enthusiasm for life")}
      ${msgHtml('lukas', 'LOOOOOOL yes. this.', '18:27')}
      ${msgHtml('amber', 'sustained enthusiasm for life I\'m using that', '18:27')}
      ${msgHtml('calli', 'you\'re all impossible', '18:27')}
      ${msgHtml('calli', '(this is a compliment)', '18:27')}`;
    G.flags.wisdomPath = 'chaos';
  } else {
    adjustRel('jordan',30); G.flags.jordanFinal = true;
    resp = `${lk(`You type something. You consider it. You delete it. The fellowship watches the
    "typing..." bubble appear and then vanish. Nobody says anything.
    Then, after thirty-seven seconds:`)}
    ${msgHtml('jordan', '👀', '18:28')}
    ${lk(`Jordan has responded. Not with words — Jordan is beyond words.
    Jordan has responded with eyes. You understand this completely.
    You are, in this moment, the same person.`)}`;
    G.flags.wisdomPath = 'void';
    addItem('👀 Jordan\'s Emoji (Rare Artefact)');
  }
  setTimeout(() => renderEnding(c), 400);
  document.getElementById('screen-ch5').querySelector('.panel-inner').innerHTML = `
    ${progressMap(5)}
    ${statBar()}
    <hr class="rule">
    <h2 class="chapter-heading">CHAPTER THE FIFTH — CONCLUDED</h2>
    <div class="message-feed">${resp}</div>
    ${lk(`Loading your ending... The scrolls are being prepared.`)}`;
}

// ═══════════════════════════════════════════════════════════════
// ENDINGS
// ═══════════════════════════════════════════════════════════════
function renderEnding(finalChoice) {
  setTimeout(() => {
    // Calculate ending based on stats and flags
    const totalRel = Object.values(G.rel).reduce((a,b) => a+b, 0);
    let ending;

    if (G.flags.wisdomPath === 'void' && G.flags.jordanAlliance) {
      ending = 'jordan';
    } else if (G.loool >= 8 && G.rizz >= 65) {
      ending = 'legend';
    } else if (G.wisdom >= 70 && G.rel.calli >= 15) {
      ending = 'sage';
    } else if (G.rel.lukas >= 20 && G.flags.alanCarrDefender) {
      ending = 'lukas';
    } else if (totalRel >= 40) {
      ending = 'fellowship';
    } else {
      ending = 'fellowship';
    }

    const endings = {
      legend: {
        title: 'THE LEGENDARY MEMBER',
        subtitle: 'You Have Achieved Maximum LOOOL',
        icon: '🏆',
        text: `The fellowship did not merely accept you. The fellowship adopted you.
        Your LOOOLs were the finest in the group. Your sardine observation was recounted
        at social gatherings for years afterwards. Lukas used a photo of your eye
        as the new group profile picture. It did not have a sardine in it.
        This was considered progress.`,
        badges: ['🐟 Sardine Observer', '😂 LOOOL Legend', '💫 Maximum Rizz'],
      },
      sage: {
        title: 'THE WISE ONE',
        subtitle: 'Calli Has Recognised You as a Fellow Thinker',
        icon: '🧠',
        text: `Calli sent you a direct message three weeks after Chapter the Fifth.
        It said simply: "you're alright you." The Lore Keeper can confirm that in
        Calli's vocabulary, this is the equivalent of a seventeen-minute standing ovation.
        You had seen the coaster. You had understood the asterisk. You had, above all,
        been right about Emma. Some of us are simply built for fellowship wisdom.`,
        badges: ['🧠 Wisdom Keeper', '🥂 Coaster Acknowledged', "✳️ Asterisk Understood"],
      },
      lukas: {
        title: 'THE ALAN CARR DEFENDER',
        subtitle: 'Lukas Has Never Made a New Group Over You',
        icon: '🗑️',
        text: `You defended Alan Carr's bin arm. Lukas has never forgotten this.
        At every subsequent gathering, he mentioned it. "Remember when they defended the bin?"
        he would say, to anyone who would listen. "That was the moment I knew."
        The bin arm was not explained further. It did not need to be.
        Some allegiances are forged in wheelie bins, and they are the strongest of all.`,
        badges: ["🗑️ Alan Carr's Ally", '🎂 Birthday Remembered', '📷 Portrait Eligible'],
      },
      jordan: {
        title: 'THE VANISHING ONE',
        subtitle: 'You and Jordan Have Reached an Understanding',
        icon: '👻',
        text: `You became Jordan. Not entirely — you still sent occasional messages,
        the odd "lol", a well-placed "omg." But Jordan understood you. Jordan's emoji
        was only the beginning. Over the following months, Jordan sent you, privately,
        a series of messages that had clearly been composed with great care.
        All of them were deleted before you could read them.
        You understood this completely. You deleted your reply.
        It was, somehow, the best conversation you have ever had.`,
        badges: ['👻 The Vanishing Ones', '👀 The Emoji Received', '🌫️ Mastered the Void'],
      },
      fellowship: {
        title: 'A FULL MEMBER OF THE FELLOWSHIP',
        subtitle: 'You Are, Genuinely, One of Them Now',
        icon: '✦',
        text: `You didn't do anything particularly remarkable.
        You were just there. You responded. You LOOOLd at the right moments.
        You were kind about Lorraine. You had a take on Emma that was, broadly,
        the right take. And one day, without announcement, Lukas added you
        to a new group — the group after this group, after the next thing
        happened with the next person. He didn't explain. He just added you.
        That was enough. That was everything.`,
        badges: ['✦ Fellowship Member', '🐱 Lorraine Respected', '📜 In the Scrolls'],
      },
    };

    const e = endings[ending];
    const relSummary = Object.entries(G.rel).map(([k,v]) => {
      const c = CHARS[k]; const pct = Math.max(0, Math.min(100, 50+v));
      const bar = Math.round(pct/10);
      return `<div class="char-stat-row">
        <span style="font-family:'Cinzel',serif;font-size:11px;color:var(--gold);">${c.emoji} ${c.name}</span>
        <span style="font-size:11px;color:var(--ink-mid);">${'◆'.repeat(bar)}${'◇'.repeat(10-bar)} ${pct}%</span>
      </div>`;
    }).join('');

    document.getElementById('app').innerHTML = `
    <div class="screen active" id="screen-ending">
      <div class="book-panel">
        <div class="panel-inner">
          <div class="title-ornament scroll-reveal">✦ ✧ ✦ ✧ ✦</div>
          <div style="font-size:52px;text-align:center;margin:12px 0;" class="scroll-reveal">${e.icon}</div>
          <h2 class="ending-title scroll-reveal">${e.title}</h2>
          <p class="title-sub scroll-reveal">${e.subtitle}</p>
          <hr class="rule">
          <div class="ending-verse scroll-reveal">
            ${e.text.split('\n').map(l => l.trim() ? `<p style="margin:6px 0;">${l.trim()}</p>` : '').join('')}
          </div>
          <hr class="rule">
          <div class="text-center scroll-reveal" style="margin:14px 0;">
            ${e.badges.map(b => `<span class="badge"><span class="badge-icon">${b.split(' ')[0]}</span>${b.split(' ').slice(1).join(' ')}</span>`).join('')}
          </div>
          <hr class="rule">
          <div class="highlight-box scroll-reveal">
            <div class="inventory-title">✦ FINAL FELLOWSHIP STANDINGS ✦</div>
            <div style="margin-top:8px;">${relSummary}</div>
            <div style="margin-top:10px;" class="char-stat-row">
              <span style="font-family:'Cinzel',serif;font-size:11px;color:var(--gold);">😂 TOTAL LOOOL</span>
              <span style="font-size:11px;color:var(--ink-mid);">${G.loool} recorded</span>
            </div>
          </div>
          <div class="highlight-box scroll-reveal">
            <div class="inventory-title">✦ YOUR FINAL INVENTORY ✦</div>
            <div class="inventory-items" style="margin-top:8px;">
              ${G.items.map(i=>`<span class="item">${i}</span>`).join('') || '<span class="item">Nothing. You passed through like smoke.</span>'}
            </div>
          </div>
          <div class="ending-verse" style="margin:20px 0; font-size:13px;">
            <em>Here endeth the Chronicle of the Fellowship of the Rizz.</em><br>
            <em>The sardine was never explained.</em><br>
            <em>It did not need to be.</em>
          </div>
          <div class="title-ornament">✦ ✧ ✦ ✧ ✦</div>
          <div class="choices" style="margin-top:20px;">
            <button class="start-btn" onclick="resetGame()" style="max-width:100%;">PLAY AGAIN · BEGIN A NEW CHRONICLE</button>
          </div>
        </div>
      </div>
    </div>`;
  }, 1200);
}

function resetGame() {
  G.playerName = ''; G.playerClass = null;
  G.aura = 50; G.wisdom = 50; G.rizz = 50;
  G.rel = { lukas:0, calli:0, amber:0, charlotte:0, jordan:0 };
  G.items = []; G.chapter = 0; G.scene = 0;
  G.flags = {}; G.loool = 0;
  renderTitle();
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildStarfield();
renderTitle();
</script>
